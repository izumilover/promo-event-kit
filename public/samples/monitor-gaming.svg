<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="게이밍 모니터">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fce7f3" />
      <stop offset="100%" stop-color="#ede9fe" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#db2777" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <g transform="translate(90 180)">
    <rect x="0" y="0" width="420" height="240" rx="10" fill="#0f0f1a" />
    <rect x="8" y="8" width="404" height="224" rx="4" fill="url(#screen)" />
    <!-- 크로스헤어 아이콘 -->
    <circle cx="210" cy="120" r="46" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.85" />
    <line x1="210" y1="50" x2="210" y2="94" stroke="#ffffff" stroke-width="4" opacity="0.85" />
    <line x1="210" y1="146" x2="210" y2="190" stroke="#ffffff" stroke-width="4" opacity="0.85" />
    <line x1="140" y1="120" x2="184" y2="120" stroke="#ffffff" stroke-width="4" opacity="0.85" />
    <line x1="236" y1="120" x2="280" y2="120" stroke="#ffffff" stroke-width="4" opacity="0.85" />
    <rect x="200" y="240" width="20" height="30" fill="#0f0f1a" />
    <rect x="160" y="270" width="100" height="10" rx="5" fill="#0f0f1a" />
  </g>
  <text x="90" y="450" font-family="sans-serif" font-size="20" font-weight="700" fill="#7c3aed">240Hz</text>
</svg>
