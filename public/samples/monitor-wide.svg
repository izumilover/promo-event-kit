<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="와이드 모니터">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe" />
      <stop offset="100%" stop-color="#ddd6fe" />
    </linearGradient>
    <linearGradient id="screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#c026d3" />
    </linearGradient>
  </defs>
  <rect width="600" height="600" fill="url(#bg)" />
  <g transform="translate(40 240)">
    <!-- 32:9 초와이드 비율 강조 -->
    <rect x="0" y="0" width="520" height="140" rx="14" fill="#1e1b2e" />
    <rect x="12" y="12" width="496" height="116" rx="6" fill="url(#screen)" />
    <rect x="40" y="46" width="200" height="12" rx="6" fill="#ffffff" opacity="0.6" />
    <rect x="40" y="70" width="140" height="10" rx="5" fill="#ffffff" opacity="0.4" />
    <rect x="380" y="40" width="100" height="60" rx="8" fill="#ffffff" opacity="0.2" />
    <rect x="245" y="140" width="30" height="30" fill="#1e1b2e" />
    <rect x="200" y="170" width="120" height="12" rx="6" fill="#1e1b2e" />
  </g>
  <text x="60" y="120" font-family="sans-serif" font-size="22" font-weight="700" fill="#7c3aed">32:9 ULTRA WIDE</text>
</svg>
